<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8F4F0"/>
      <stop offset="100%" style="stop-color:#F5F1E6"/>
    </linearGradient>
    <linearGradient id="building" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2D6A4F"/>
      <stop offset="100%" style="stop-color:#1B4D3E"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#sky)"/>

  <!-- Ground -->
  <rect x="0" y="320" width="800" height="80" fill="#E8E4D9"/>

  <!-- Main Building -->
  <rect x="150" y="150" width="500" height="170" fill="url(#building)" rx="4"/>

  <!-- Windows grid -->
  <g fill="#F5F1E6" opacity="0.8">
    <rect x="180" y="170" width="40" height="30" rx="2"/>
    <rect x="240" y="170" width="40" height="30" rx="2"/>
    <rect x="300" y="170" width="40" height="30" rx="2"/>
    <rect x="360" y="170" width="40" height="30" rx="2"/>
    <rect x="420" y="170" width="40" height="30" rx="2"/>
    <rect x="480" y="170" width="40" height="30" rx="2"/>
    <rect x="540" y="170" width="40" height="30" rx="2"/>
    <rect x="600" y="170" width="40" height="30" rx="2"/>

    <rect x="180" y="220" width="40" height="30" rx="2"/>
    <rect x="240" y="220" width="40" height="30" rx="2"/>
    <rect x="300" y="220" width="40" height="30" rx="2"/>
    <rect x="360" y="220" width="40" height="30" rx="2"/>
    <rect x="420" y="220" width="40" height="30" rx="2"/>
    <rect x="480" y="220" width="40" height="30" rx="2"/>
    <rect x="540" y="220" width="40" height="30" rx="2"/>
    <rect x="600" y="220" width="40" height="30" rx="2"/>

    <rect x="180" y="270" width="40" height="30" rx="2"/>
    <rect x="240" y="270" width="40" height="30" rx="2"/>
    <rect x="300" y="270" width="40" height="30" rx="2"/>
    <rect x="420" y="270" width="40" height="30" rx="2"/>
    <rect x="480" y="270" width="40" height="30" rx="2"/>
    <rect x="540" y="270" width="40" height="30" rx="2"/>
    <rect x="600" y="270" width="40" height="30" rx="2"/>
  </g>

  <!-- Main entrance -->
  <rect x="360" y="260" width="80" height="60" fill="#C9A227" rx="2"/>
  <rect x="375" y="270" width="50" height="50" fill="#0F2F26"/>

  <!-- Roof elements -->
  <rect x="250" y="130" width="100" height="25" fill="#1B4D3E" rx="2"/>
  <rect x="450" y="130" width="100" height="25" fill="#1B4D3E" rx="2"/>

  <!-- Trees -->
  <g transform="translate(80, 240)">
    <rect x="15" y="60" width="10" height="30" fill="#5D4E37"/>
    <ellipse cx="20" cy="50" rx="25" ry="35" fill="#2D6A4F"/>
  </g>
  <g transform="translate(700, 250)">
    <rect x="15" y="50" width="10" height="25" fill="#5D4E37"/>
    <ellipse cx="20" cy="40" rx="22" ry="30" fill="#2D6A4F"/>
  </g>

  <!-- Company name hint -->
  <rect x="320" y="100" width="160" height="30" fill="#C9A227" rx="4"/>
  <text x="400" y="120" text-anchor="middle" fill="#1B4D3E" font-family="system-ui" font-size="14" font-weight="600">ZL BOTANICALS</text>
</svg>
